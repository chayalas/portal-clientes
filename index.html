<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de clientes · Walkmansion</title>
<style>
  /* La marca no cambia entre modos: azul pizarra y verde lima. Lo que cambia son
     los fondos y los textos. Todo pasa por estas variables — ningún color se
     escribe suelto más abajo, para que agregar un modo nuevo no sea una cacería. */
  :root{
    --navy:#282D3A; --lima:#D0FB57;
    --fondo:#F6F7F8; --tarjeta:#ffffff; --linea:#E3E6EA;
    --texto:#282D3A; --tenue:#6B7280; --tenue2:#9AA1AC;
    --hero-bg:#282D3A; --hero-linea:#3A4152; --hero-texto:#B7BECB; --hero-tenue:#8A93A2;
    --suave:#F4F6F8; --pista:#EDF0F3; --relleno:#282D3A;
    --aviso-bg:#FEF3C7; --aviso-texto:#B45309;
    --radio:14px;
    --fuente:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html[data-modo="oscuro"]{
    --fondo:#171A21; --tarjeta:#21252F; --linea:#333A48;
    --texto:#ECEEF2; --tenue:#98A1B0; --tenue2:#79828F;
    --hero-bg:#2E3442; --hero-linea:#434B5C; --hero-texto:#C4CBD6; --hero-tenue:#8F98A6;
    --suave:#2A2F3B; --pista:#333A48; --relleno:#D0FB57;
    --aviso-bg:#3A2F14; --aviso-texto:#F3C969;
    color-scheme:dark;
  }
  html[data-modo="oscuro"] .barra span{background:var(--lima)}
  html[data-modo="oscuro"] .hero .monto{color:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--fuente);background:var(--fondo);color:var(--texto);transition:background .2s,color .2s;
       -webkit-font-smoothing:antialiased;line-height:1.5}
  .oculto{display:none!important}

  /* ---------- Entrada ---------- */
  #entrada{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--navy)}
  .caja{width:100%;max-width:380px}
  .marca{display:flex;align-items:baseline;gap:2px;margin-bottom:28px;justify-content:center}
  .marca b{color:#fff;font-size:22px;font-weight:700;letter-spacing:-.02em}
  .marca i{display:inline-block;width:9px;height:22px;background:var(--lima);
           transform:skewX(-18deg);margin:0 3px}
  .caja h1{color:#fff;font-size:19px;font-weight:600;margin-bottom:4px;text-align:center}
  .caja p.sub{color:#98A0AE;font-size:14px;margin-bottom:24px;text-align:center}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:12px;color:#98A0AE;margin-bottom:6px;font-weight:500}
  .campo input{width:100%;padding:13px 14px;border:1px solid #3A4152;border-radius:10px;
    background:#31384A;color:#fff;font-size:16px;font-family:inherit}
  .campo input:focus{outline:none;border-color:var(--lima)}
  button.principal{width:100%;padding:14px;border:0;border-radius:10px;background:var(--lima);
    color:var(--navy);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px}
  button.principal:disabled{opacity:.55;cursor:default}
  #errorEntrada{color:#FCA5A5;font-size:13px;margin-top:14px;text-align:center;min-height:18px}
  .alterno{display:block;width:100%;background:none;border:0;color:#98A0AE;font-size:13px;
    font-family:inherit;cursor:pointer;margin-top:14px;text-decoration:underline;text-underline-offset:3px}
  .enviado{background:#31384A;border:1px solid #3A4152;border-radius:10px;padding:16px;
    margin-top:16px;color:#fff;font-size:14px;line-height:1.55;text-align:center}
  .enviado b{color:var(--lima)}
  .codigo{margin-top:16px;padding-top:16px;border-top:1px solid #3A4152;text-align:left}
  .codigo label{display:block;font-size:12px;color:#98A0AE;margin-bottom:6px;font-weight:500}
  .codigo input{width:100%;padding:13px 14px;border:1px solid #3A4152;border-radius:10px;
    background:#282D3A;color:#fff;font-size:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.2em;text-align:center}
  .codigo input::placeholder{font-size:13px;letter-spacing:0;font-family:var(--fuente);color:#6B7280}
  .codigo input:focus{outline:none;border-color:var(--lima)}
  .codigo button{width:100%;margin-top:10px;padding:12px;border:1px solid var(--lima);border-radius:10px;
    background:none;color:var(--lima);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .codigo button:disabled{opacity:.5;cursor:default}

  /* ---------- Portal ---------- */
  #portal{max-width:620px;margin:0 auto;padding:0 16px 56px}
  header.barra{display:flex;align-items:center;justify-content:space-between;
    padding:18px 0 22px;border-bottom:1px solid var(--linea);margin-bottom:24px}
  header.barra .marca{margin:0}
  header.barra .marca b{color:var(--navy);font-size:17px}
  header.barra .marca i{height:17px;width:7px}
  .modo{background:none;border:0;color:var(--tenue);font-size:15px;cursor:pointer;
    padding:6px 8px;border-radius:8px;line-height:1}
  .modo:hover{background:var(--suave)}
  .salir{background:none;border:0;color:var(--tenue);font-size:13px;cursor:pointer;font-family:inherit;padding:6px}

  .saludo{font-size:13px;color:var(--tenue);margin-bottom:2px}
  .nombre{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:20px}

  .tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio);
    padding:18px;margin-bottom:14px}
  .etiqueta{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--tenue2);font-weight:600;margin-bottom:10px}
  .corte{font-size:11px;color:var(--tenue2);margin-top:12px;padding-top:10px;border-top:1px solid var(--linea)}

  /* Bloque principal */
  .hero{background:var(--hero-bg);border-radius:var(--radio);padding:22px;margin-bottom:14px;color:#fff}
  .hero .etiqueta{color:var(--lima);margin-bottom:8px}
  .hero .monto{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  .hero .cuando{font-size:15px;color:var(--hero-texto);margin-top:6px}
  .hero .nota{font-size:12px;color:var(--hero-tenue);margin-top:14px;padding-top:12px;border-top:1px solid var(--hero-linea)}

  /* Aportado */
  .cifras{display:flex;gap:12px;flex-wrap:wrap}
  .cifra{flex:1;min-width:130px}
  .cifra .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .cifra .k{font-size:12px;color:var(--tenue);margin-top:2px}
  .barra{height:7px;background:var(--pista);border-radius:99px;overflow:hidden;margin-top:14px}
  .barra span{display:block;height:100%;background:var(--relleno);border-radius:99px}

  .preliminar{display:inline-block;background:var(--aviso-bg);color:var(--aviso-texto);font-size:11px;
    font-weight:600;padding:4px 9px;border-radius:99px;margin-top:12px}

  /* Unidad */
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .datos div span{display:block;font-size:11px;color:var(--tenue2);margin-bottom:1px}
  .datos div b{font-size:14px;font-weight:600}

  /* Movimientos */
  .mov{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--linea)}
  .mov:last-of-type{border-bottom:0;padding-bottom:0}
  .mov .izq .c{font-size:14px;font-weight:600}
  .mov .izq .d{font-size:12px;color:var(--tenue);margin-top:2px}
  .mov .der{text-align:right;white-space:nowrap}
  .mov .der .m{font-size:14px;font-weight:600}
  .mov .der .r{font-size:11px;color:var(--tenue2);margin-top:2px}

  .masmov{width:100%;margin-top:14px;padding:11px;background:var(--suave);border:1px solid var(--linea);
    border-radius:10px;color:var(--texto);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .masmov:hover{background:var(--pista)}
  .doc{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--linea)}
  .doc:last-of-type{border-bottom:0;padding-bottom:0}
  .doc .ico{flex:0 0 38px;height:44px;border:1px solid var(--linea);border-radius:7px;
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
    color:var(--tenue);background:var(--suave);letter-spacing:.03em}
  .doc .txt{flex:1;min-width:0}
  .doc .txt .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc .txt .t{font-size:12px;color:var(--tenue);margin-top:2px}
  .doc .ver{flex:0 0 auto;background:none;border:1px solid var(--linea);border-radius:8px;
    padding:8px 14px;font-size:13px;font-weight:600;color:var(--texto);font-family:inherit;cursor:pointer}
  .doc .ver:hover{background:var(--suave)}
  .doc .ver:disabled{opacity:.5;cursor:default}
  .vacio{color:var(--tenue);font-size:14px;line-height:1.55}

  .avanceCifra{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
  .avanceCifra b{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .avanceCifra span{font-size:14px;color:var(--tenue)}
  .etapa{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px}
  .trabajos{margin-top:16px;border-top:1px solid var(--linea);padding-top:4px}
  .trabajo{display:flex;gap:12px;padding:9px 0;font-size:14px;align-items:baseline}
  .trabajo .pisos{flex:0 0 74px;font-size:12px;color:var(--tenue2);font-weight:600}
  .trabajo.tuyo{margin:4px -10px;padding:9px 10px;background:var(--suave);border-radius:9px}
  .trabajo.tuyo .pisos{color:var(--texto)}
  .trabajo.tuyo .que{font-weight:600}
  .tupiso{display:inline-block;background:var(--lima);color:var(--navy);font-size:10px;
    font-weight:700;padding:2px 7px;border-radius:99px;margin-left:8px;letter-spacing:.02em;
    vertical-align:middle}
  .etapas{display:flex;gap:6px;margin:16px 0 10px}
  .etapas div{flex:1;text-align:center}
  .etapas .marca{height:6px;border-radius:99px;background:var(--pista)}
  .etapas .hecha .marca{background:var(--relleno)}
  .etapas .ahora .marca{background:var(--lima)}
  .etapas span{display:block;font-size:11px;color:var(--tenue2);margin-top:7px}
  .etapas .ahora span{color:var(--texto);font-weight:700}
  .etapas .hecha span{color:var(--tenue)}
  .fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:16px}
  .fotos a{display:block;aspect-ratio:4/3;border-radius:9px;overflow:hidden;border:1px solid var(--linea);background:var(--suave)}
  .fotos img{width:100%;height:100%;object-fit:cover;display:block}
  .viejo{background:var(--aviso-bg);color:var(--aviso-texto);font-size:12.5px;line-height:1.55;
    padding:11px 13px;border-radius:9px;margin-top:14px}
  .pie{font-size:12px;color:var(--tenue2);text-align:center;margin-top:26px;line-height:1.6}
  #cargando{padding:80px 20px;text-align:center;color:var(--tenue)}
</style>
</head>
<body>

<!-- ============ ENTRADA ============ -->
<section id="entrada" class="oculto">
  <div class="caja">
    <div class="marca"><b>Walkmansion</b><i></i></div>
    <h1>Tu portal</h1>
    <p class="sub">Escribe tu correo y te mandamos un enlace para entrar. Sin contraseñas.</p>
    <form id="formEntrada">
      <div class="campo">
        <label for="correo">Tu correo</label>
        <input id="correo" type="email" autocomplete="email" required>
      </div>
      <div class="campo oculto" id="campoClave">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password">
      </div>
      <button class="principal" id="btnEntrar" type="submit">Enviar mi enlace de acceso</button>
      <div id="errorEntrada"></div>
      <div id="avisoEnviado" class="enviado oculto">
        <div id="textoEnviado"></div>
        <div class="codigo">
          <label for="codigo">¿No te funcionó el enlace? Usa el código del correo</label>
          <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="10" placeholder="Pega el código del correo">
          <button type="button" id="btnCodigo">Entrar con el código</button>
        </div>
      </div>
      <!-- Puerta de servicio: solo para las pruebas de Carlos. Se quita antes de dar acceso a clientes. -->
      <button type="button" class="alterno" id="btnAlterno">Entrar con contraseña</button>
    </form>
  </div>
</section>

<div id="cargando">Cargando…</div>

<!-- ============ PORTAL ============ -->
<main id="portal" class="oculto">
  <header class="barra">
    <div class="marca"><b>Walkmansion</b><i></i></div>
    <div style="display:flex;align-items:center;gap:4px">
      <button class="modo" id="btnModo" aria-label="Cambiar entre claro y oscuro"></button>
      <button class="salir" id="btnSalir">Salir</button>
    </div>
  </header>

  <p class="saludo">Hola,</p>
  <h1 class="nombre" id="nombre"></h1>

  <!-- Lo que sigue: próximo pago o saldo de liquidación -->
  <section class="hero" id="hero"></section>

  <!-- Lo aportado -->
  <section class="tarjeta">
    <div class="etiqueta">Lo que llevas pagado</div>
    <div class="cifras">
      <div class="cifra"><div class="v" id="aportado"></div><div class="k">aportado</div></div>
      <div class="cifra"><div class="v" id="porcentaje"></div><div class="k">del valor de tu unidad</div></div>
    </div>
    <div class="barra"><span id="barra"></span></div>
    <div id="avisoPreliminar"></div>
    <div class="corte" id="cortePago"></div>
  </section>

  <!-- Su unidad -->
  <section class="tarjeta">
    <div class="etiqueta">Tu unidad</div>
    <div class="datos" id="datosUnidad"></div>
  </section>

  <!-- Movimientos -->
  <section class="tarjeta">
    <div class="etiqueta">Movimientos identificados</div>
    <div id="movimientos"></div>
    <div class="corte" id="corteMovimientos"></div>
  </section>

  <!-- Avance de obra -->
  <section class="tarjeta" id="tarjetaObra">
    <div class="etiqueta">Cómo va tu obra</div>
    <div id="obra"></div>
  </section>

  <!-- Documentos -->
  <section class="tarjeta">
    <div class="etiqueta">Tus documentos</div>
    <div id="documentos"></div>
  </section>

  <p class="pie" id="pie"></p>
</main>

<script>
  // Se aplica ANTES de que cargue nada más: si se hiciera después, el cliente
  // vería un destello blanco antes de que la página se ponga oscura.
  // Sin preferencia guardada, se respeta la del teléfono o la computadora.
  (function () {
    var guardado = null
    try { guardado = localStorage.getItem('wm-modo') } catch (e) {}
    var oscuro = guardado
      ? guardado === 'oscuro'
      : window.matchMedia('(prefers-color-scheme: dark)').matches
    document.documentElement.dataset.modo = oscuro ? 'oscuro' : 'claro'
  })()
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://lyumrzowusjzfeqkglvm.supabase.co'
const SUPABASE_KEY = 'sb_publishable_623gFtuDfFpP_Ghi9KEjAA_jlqb3RDG'
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

const $ = id => document.getElementById(id)
const mostrar = id => $(id).classList.remove('oculto')
const esconder = id => $(id).classList.add('oculto')

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
const dinero = n => (n===null||n===undefined) ? '—'
  : '$' + Number(n).toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2})
const dineroCorto = n => '$' + Number(n).toLocaleString('es-MX',{maximumFractionDigits:0})
const fecha = s => { if(!s) return '—'
  const [a,m,d] = s.split('-').map(Number)
  return `${d} de ${MESES[m-1]} de ${a}` }
// Un avance de obra es una foto del mes, no de un dia: se muestra sin dia.
const mesAnio = s => { if(!s) return '—'
  const [a,m] = s.split('-').map(Number)
  return `${MESES[m-1]} de ${a}` }
const fechaCorta = s => { if(!s) return '—'
  const [a,m,d] = s.split('-').map(Number)
  return `${d} ${MESES[m-1].slice(0,3)} ${a}` }
const sumarMeses = (iso, n) => {
  const [a,m,d] = iso.split('-').map(Number)
  const f = new Date(Date.UTC(a, m-1+n, 1))
  const ultimo = new Date(Date.UTC(f.getUTCFullYear(), f.getUTCMonth()+1, 0)).getUTCDate()
  f.setUTCDate(Math.min(d, ultimo))
  return f.toISOString().slice(0,10)
}

// ---------- Arranque ----------
const { data:{ session } } = await sb.auth.getSession()
session ? cargar() : (esconder('cargando'), mostrar('entrada'))

// Dos formas de entrar. El enlace por correo es la de los clientes; la contraseña
// es puerta de servicio para las pruebas y se quita antes del lanzamiento.
let modoClave = false

$('btnAlterno').addEventListener('click', () => {
  modoClave = !modoClave
  $('campoClave').classList.toggle('oculto', !modoClave)
  $('clave').required = modoClave
  $('btnEntrar').textContent = modoClave ? 'Entrar' : 'Enviar mi enlace de acceso'
  $('btnAlterno').textContent = modoClave ? 'Mejor mándame un enlace' : 'Entrar con contraseña'
  $('errorEntrada').textContent = ''
  $('avisoEnviado').classList.add('oculto')
})

$('formEntrada').addEventListener('submit', async e => {
  e.preventDefault()
  const correo = $('correo').value.trim()
  $('btnEntrar').disabled = true
  $('errorEntrada').textContent = ''
  $('avisoEnviado').classList.add('oculto')

  if (modoClave) {
    const { error } = await sb.auth.signInWithPassword({ email: correo, password: $('clave').value })
    $('btnEntrar').disabled = false
    if (error) { $('errorEntrada').textContent = 'No pudimos entrar con esos datos.'; return }
    esconder('entrada'); mostrar('cargando'); cargar()
    return
  }

  const { error } = await sb.auth.signInWithOtp({
    email: correo,
    options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false }
  })
  $('btnEntrar').disabled = false

  if (error) {
    // shouldCreateUser:false hace que un correo que no está dado de alta no reciba nada.
    // No se le dice "no existe": eso le confirmaría a un extraño quién es cliente y quién no.
    $('errorEntrada').textContent = 'No pudimos enviar el enlace en este momento. Escríbele a tu asesor.'
    return
  }
  $('avisoEnviado').classList.remove('oculto')
  $('textoEnviado').innerHTML =
    `Si <b>${correo}</b> está registrado, en unos segundos te llega el correo.<br>
     Trae un enlace y un código. Cualquiera de los dos sirve.`
  $('codigo').focus()
})

// El código existe porque el enlace falla más de lo que parece: algunos servicios de
// correo lo abren por su cuenta para revisarlo y lo gastan, y el navegador que traen
// dentro las apps de correo a veces no guarda la sesión. El código no se gasta, y
// permite leer el correo en un aparato y entrar desde otro.
$('btnCodigo').addEventListener('click', async () => {
  // NO se fija un largo. Supabase puede emitir códigos de 6 u 8 dígitos según su
  // configuración, y esa configuración puede cambiar. Quien valida el código es
  // Supabase, no esta página: aquí solo se limpia lo que el cliente pegó.
  // (El 2026-09-19 esto estaba clavado en 6 y el proyecto mandaba 8. No repetirlo.)
  const token = $('codigo').value.replace(/\D/g, '')
  if (token.length < 4) {
    $('errorEntrada').textContent = 'Escribe el código completo que viene en el correo.'
    return
  }
  $('btnCodigo').disabled = true
  $('errorEntrada').textContent = ''
  const { error } = await sb.auth.verifyOtp({
    email: $('correo').value.trim(), token, type: 'email'
  })
  $('btnCodigo').disabled = false
  if (error) {
    $('errorEntrada').textContent = 'Ese código no es válido o ya venció. Pide uno nuevo.'
    $('codigo').select()
    return
  }
  esconder('entrada'); mostrar('cargando'); cargar()
})

$('codigo').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnCodigo').click() })

const pintarBotonModo = () =>
  $('btnModo').textContent = document.documentElement.dataset.modo === 'oscuro' ? '☀' : '☾'
pintarBotonModo()

$('btnModo').addEventListener('click', () => {
  const nuevo = document.documentElement.dataset.modo === 'oscuro' ? 'claro' : 'oscuro'
  document.documentElement.dataset.modo = nuevo
  try { localStorage.setItem('wm-modo', nuevo) } catch (e) {}
  pintarBotonModo()
})

$('btnSalir').addEventListener('click', async () => {
  await sb.auth.signOut(); location.reload()
})

// ---------- Carga ----------
async function cargar(){
  const { data: cliente } = await sb.from('clientes').select('nombre').single()

  const { data: compra, error } = await sb.from('compras').select(`
      precio_total, precio_departamento, pagado_confirmado, pagado_es_preliminar,
      pagado_fecha_corte, num_mensualidades, monto_mensualidad, dia_pago,
      primera_mensualidad, esquema, cajones_desc, bodega_desc,
      unidades ( numero, nivel,
        modelos ( nombre, recamaras, banos, superficie_m2, construccion_m2, terraza_m2 ),
        torres ( id, nombre, entrega_estimada, entrega_contrato,
          desarrollos ( nombre, desarrollador ) ) )
    `).single()

  if (error || !compra) {
    esconder('cargando')
    $('portal').classList.remove('oculto')
    $('nombre').textContent = cliente?.nombre || ''
    $('hero').innerHTML = `<div class="etiqueta">Tu portal</div>
      <div class="cuando">Todavía no hay información cargada en tu cuenta.
      Escríbele a tu asesor y la subimos.</div>`
    return
  }

  const { data: pagos } = await sb.from('pagos')
    .select('fecha, concepto, monto, forma_pago, banco_parcial, num_recibo')
    .order('fecha', { ascending: true })

  const { data: docs } = await sb.from('documentos')
    .select('tipo, nombre, storage_path, subido_en')
    .order('subido_en', { ascending: false })

  const { data: avances } = await sb.from('avances_obra')
    .select('fecha, fecha_pedido, porcentaje, etapa, descripcion, fotos')
    .eq('torre_id', compra.unidades.torres.id)
    .order('fecha', { ascending: false })
    .limit(1)

  pintar(cliente, compra, pagos || [], docs || [], (avances || [])[0] || null)
}

// ---------- Pintado ----------
function pintar(cliente, c, pagos, docs, avance){
  const u = c.unidades, m = u.modelos, t = u.torres, d = t.desarrollos

  $('nombre').textContent = cliente?.nombre || ''

  // -- Cuántas mensualidades lleva --
  const pagadas = pagos.filter(p => /mensualidad/i.test(p.concepto)).length
  const faltan  = (c.num_mensualidades || 0) - pagadas

  // -- Bloque principal --
  if (faltan > 0 && c.primera_mensualidad) {
    const vence = sumarMeses(c.primera_mensualidad, pagadas)
    $('hero').innerHTML = `
      <div class="etiqueta">Tu próximo pago</div>
      <div class="monto">${dinero(c.monto_mensualidad)}</div>
      <div class="cuando">Vence el ${fecha(vence)}</div>
      <div class="nota">Mensualidad ${pagadas+1} de ${c.num_mensualidades}
        · te faltan ${faltan} después de esta</div>`
  } else {
    // Ya terminó sus mensualidades: lo que sigue es liquidar contra entrega.
    // Nunca se le llama "próximo pago" a algo que no tiene fecha de cobro.
    const saldo = Number(c.precio_total) - Number(c.pagado_confirmado || 0)
    $('hero').innerHTML = `
      <div class="etiqueta">Saldo a liquidar contra entrega</div>
      <div class="monto">${dinero(saldo)}</div>
      <div class="cuando">Entrega estimada: ${fecha(t.entrega_estimada)}</div>
      <div class="nota">Ya cubriste tus ${c.num_mensualidades} mensualidades.
        Este saldo se paga al momento de la entrega.</div>`
  }

  // -- Aportado --
  const pagado = Number(c.pagado_confirmado || 0)
  const total  = Number(c.precio_total)
  $('aportado').textContent   = dinero(pagado)
  $('porcentaje').textContent = total ? (pagado/total*100).toFixed(1).replace('.',',') + '%' : '—'
  $('barra').style.width      = total ? Math.min(100, pagado/total*100) + '%' : '0%'

  if (c.pagado_es_preliminar) {
    $('avisoPreliminar').innerHTML =
      `<span class="preliminar">Cifra preliminar · en confirmación con el desarrollador</span>`
  }
  $('cortePago').textContent = c.pagado_fecha_corte
    ? `Información actualizada al ${fecha(c.pagado_fecha_corte)}`
    : 'Fecha de corte pendiente'

  // -- Unidad --
  const filas = [
    ['Desarrollo', d.nombre],
    ['Unidad',     `${u.numero}${t.nombre && t.nombre !== 'Única' ? ' · torre ' + t.nombre : ''}`],
    ['Nivel',      u.nivel ?? '—'],
    ['Prototipo',  m.nombre],
    ['Recámaras',  `${m.recamaras} rec · ${m.banos} baños`],
    ['Superficie', `${m.superficie_m2} m²`],
  ]
  if (m.terraza_m2) filas.push(['Terraza', `${m.terraza_m2} m²`])
  if (c.cajones_desc) filas.push(['Estacionamiento', c.cajones_desc])
  if (c.bodega_desc)  filas.push(['Bodega', c.bodega_desc])
  filas.push(['Desarrollador', d.desarrollador || '—'])
  filas.push(['Esquema de pago', c.esquema || '—'])

  $('datosUnidad').innerHTML = filas
    .map(([k,v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')

  // -- Movimientos --
  // Se muestran los recientes y el resto queda plegado. Con dos años de mensualidades
  // la lista completa sepulta todo lo demás, y lo que el cliente mira primero es lo último.
  // El detalle no se pierde: se guarda a un clic.
  const VISIBLES = 4
  const orden = pagos.slice().reverse()
  const fila = p => `
    <div class="mov">
      <div class="izq">
        <div class="c">${p.concepto}</div>
        <div class="d">${fechaCorta(p.fecha)}${p.forma_pago ? ' · ' + p.forma_pago : ''}${
          p.banco_parcial && p.banco_parcial !== '—' ? ' · ' + p.banco_parcial : ''}</div>
      </div>
      <div class="der">
        <div class="m">${dinero(p.monto)}</div>
        ${p.num_recibo ? `<div class="r">recibo ${p.num_recibo}</div>` : ''}
      </div>
    </div>`

  if (!orden.length) {
    $('movimientos').innerHTML = `<p style="color:var(--tenue);font-size:14px">Todavía no hay movimientos registrados.</p>`
  } else if (orden.length <= VISIBLES) {
    $('movimientos').innerHTML = orden.map(fila).join('')
  } else {
    const ocultos = orden.length - VISIBLES
    $('movimientos').innerHTML =
      `<div id="movRecientes">${orden.slice(0, VISIBLES).map(fila).join('')}</div>
       <div id="movResto" class="oculto">${orden.slice(VISIBLES).map(fila).join('')}</div>
       <button class="masmov" id="btnMasMov">Ver los ${ocultos} movimientos anteriores</button>`
    let abierto = false
    $('btnMasMov').addEventListener('click', () => {
      abierto = !abierto
      $('movResto').classList.toggle('oculto', !abierto)
      $('btnMasMov').textContent = abierto
        ? 'Ver menos'
        : `Ver los ${ocultos} movimientos anteriores`
    })
  }

  const suma = pagos.reduce((a,p) => a + Number(p.monto), 0)
  $('corteMovimientos').textContent =
    `${pagos.length} ${pagos.length===1?'movimiento':'movimientos'} · suman ${dinero(suma)}`

  // -- Avance de obra --
  // Resumen, no reporte técnico: la etapa con nombre, una barra de tres tramos,
  // dos frases y pocas fotos. Y la fecha en grande, no al pie: el desarrollador
  // informa cuando le piden, no cada mes, y un avance viejo sin fecha es una
  // afirmación falsa sobre el estado de la obra.
  const ETAPAS = ['Cimentación', 'Estructura', 'Acabados']

  if (!avance) {
    $('obra').innerHTML = `<p class="vacio">Todavía no hay un reporte de avance cargado.
      En cuanto el desarrollador nos entregue el siguiente, aparece aquí.</p>`
  } else {
    const actual = ETAPAS.findIndex(e =>
      (avance.etapa || '').toLowerCase().startsWith(e.slice(0, 5).toLowerCase()))

    const tramos = ETAPAS.map((e, i) => {
      const clase = actual < 0 ? '' : i < actual ? 'hecha' : i === actual ? 'ahora' : ''
      return `<div class="${clase}"><div class="marca"></div><span>${e}</span></div>`
    }).join('')

    // ¿Cuántos meses tiene el reporte?
    const hoy = new Date()
    const [fa, fm] = avance.fecha.split('-').map(Number)
    const meses = (hoy.getFullYear() - fa) * 12 + (hoy.getMonth() + 1 - fm)

    const aviso = meses >= 4
      ? `<div class="viejo"><b>Este reporte tiene ${meses} meses.</b>
         ${avance.fecha_pedido
            ? `Le pedimos la actualización al desarrollador el ${fecha(avance.fecha_pedido)} y la
               publicamos en cuanto llegue.`
            : 'Ya solicitamos la actualización.'}</div>`
      : ''

    // El porcentaje va como número grande + barra, no como dona ni gráfica:
    // es un solo valor contra un total, sin categorías que comparar. Y usa la
    // misma barra que "lo que llevas pagado", para que el portal hable un solo
    // idioma visual. El % solo no dice mucho — por eso va junto a la etapa.
    const cifra = avance.porcentaje != null
      ? `<div class="avanceCifra"><b>${avance.porcentaje}%</b><span>de avance</span></div>
         <div class="barra" style="margin-bottom:14px">
           <span style="width:${Math.min(100, avance.porcentaje)}%"></span></div>`
      : ''

    // Los trabajos vienen por rango de pisos ("5-12 | tablaroca"). Como el portal
    // sabe en qué nivel está este cliente, le marca SU renglón. Es la diferencia
    // entre leer un reporte de la torre y ver cómo va tu departamento.
    const miNivel = u.nivel
    const lineas = (avance.descripcion || '').split('\n').filter(Boolean)
    const trabajos = lineas.length ? `<div class="trabajos">` + lineas.map(l => {
      const m = l.match(/^\s*(\d+)\s*-\s*(\d+)\s*\|\s*(.+)$/)
      if (!m) return `<div class="trabajo"><div class="que">${l}</div></div>`
      const [, desde, hasta, que] = m
      const esMio = miNivel != null && miNivel >= +desde && miNivel <= +hasta
      return `<div class="trabajo${esMio ? ' tuyo' : ''}">
                <div class="pisos">Pisos ${desde}–${hasta}</div>
                <div class="que">${que}${esMio ? '<span class="tupiso">TU PISO</span>' : ''}</div>
              </div>`
    }).join('') + `</div>` : ''

    $('obra').innerHTML = `
      ${cifra}
      <div class="etapa">${avance.etapa || 'En construcción'}</div>
      <div style="font-size:13px;color:var(--tenue)">
        Reportado por el desarrollador en ${mesAnio(avance.fecha)}</div>
      <div class="etapas">${tramos}</div>
      ${trabajos}
      <div class="fotos" id="fotosObra"></div>
      ${aviso}`

    // Las fotos viven en almacenamiento privado, igual que los documentos:
    // cada una se pide con un enlace temporal, no hay dirección pública.
    if (avance.fotos && avance.fotos.length) {
      Promise.all(avance.fotos.slice(0, 4).map(ruta =>
        sb.storage.from('obra').createSignedUrl(ruta, 600)
      )).then(res => {
        $('fotosObra').innerHTML = res
          .filter(r => r.data)
          .map(r => `<a href="${r.data.signedUrl}" target="_blank">
                       <img src="${r.data.signedUrl}" alt="Avance de obra" loading="lazy">
                     </a>`).join('')
      })
    }
  }

  // -- Documentos --
  // Los archivos viven en almacenamiento PRIVADO. No hay liga permanente a ninguno:
  // al dar clic se pide un enlace temporal que vive un minuto y luego muere. Si alguien
  // copiara ese enlace, deja de servir solo. Nunca hay una URL pública de un contrato.
  const extension = n => (n.split('.').pop() || '').toUpperCase().slice(0, 4)

  $('documentos').innerHTML = docs.length
    ? docs.map((d, i) => `
        <div class="doc">
          <div class="ico">${extension(d.nombre)}</div>
          <div class="txt">
            <div class="n">${d.nombre}</div>
            <div class="t">${d.tipo}</div>
          </div>
          <button class="ver" data-i="${i}">Ver</button>
        </div>`).join('')
    : `<p class="vacio">Todavía no hay documentos cargados.
       Tu contrato y tus comprobantes aparecerán aquí.</p>`

  $('documentos').querySelectorAll('.ver').forEach(btn => {
    btn.addEventListener('click', async () => {
      const d = docs[Number(btn.dataset.i)]
      btn.disabled = true
      const previo = btn.textContent
      btn.textContent = 'Abriendo…'
      const { data, error } = await sb.storage
        .from('documentos').createSignedUrl(d.storage_path, 60)
      btn.disabled = false
      btn.textContent = previo
      if (error || !data) {
        btn.textContent = 'No disponible'
        return
      }
      window.open(data.signedUrl, '_blank')
    })
  })

  // -- Pie --
  const entregaContrato = t.entrega_contrato
    ? ` · Entrega comprometida en contrato: ${fecha(t.entrega_contrato)}`
    : ''
  $('pie').textContent =
    `Entrega estimada: ${fecha(t.entrega_estimada)}${entregaContrato}. ` +
    `Si algo aquí no coincide con tu contrato, dínoslo.`

  esconder('cargando'); mostrar('portal')
}
</script>
